name: Site
# Publie le site (GitHub Pages, source « GitHub Actions »). Les cours en direct (data/live.json)
# sont lus directement depuis le dépôt par la page : inutile de republier à chaque minute.
on:
  push:
    branches: [main]
    paths-ignore: ['data/live.json']
  workflow_run:
    workflows: [Cours, Nuit]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
