name: Nuit
on:
  schedule:
    - cron: '20 23 * * 1-5'   # chaque soir : chiffres des sociétés + dernier cours de toutes les actions
    - cron: '0 3 * * 0'       # chaque dimanche : historiques par roulement ; le 1er du mois, aussi la liste des tickers
  push:
    branches: [main]
    paths: ['data/lancer_nuit.txt']   # modifier ce fichier relance tout de suite les historiques complets
  workflow_dispatch:
    inputs:
      quoi:
        description: 'soir ou mois'
        default: 'soir'
permissions:
  contents: write
concurrency:
  group: nuit   # travaux longs à part : ne bloquent pas les cours
  cancel-in-progress: false
jobs:
  nuit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Travaux
        env:
          IN_QUOI: ${{ github.event.inputs.quoi }}
        run: |
          Q="$IN_QUOI"
          if [ "${{ github.event_name }}" = "push" ]; then Q=mois; fi
          if [ -z "$Q" ]; then
            if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
              if [ "$(date -u +%d)" -le 7 ]; then Q=mois; else Q=semaine; fi
            else Q=soir; fi
          fi
          # liste des tickers le 1er dimanche du mois ; historiques chaque dimanche, par roulement (les plus anciens d'abord)
          if [ "$Q" = "mois" ]; then python tools/nuit.py tickers; fi
          if [ "$Q" = "mois" ] || [ "$Q" = "semaine" ]; then BUDGET_MIN=230 python tools/nuit.py histo; fi
          # logos analysés une fois par semaine (blanc -> fond sombre, en toutes lettres -> initiale, absent -> source suivante)
          if [ "$Q" = "mois" ] || [ "$Q" = "semaine" ]; then pip install -q pillow && timeout 20m python tools/logos.py || true; fi
          python tools/nuit.py chiffres
          python tools/nuit.py secteurs || true
          python tools/nuit.py splits || true
          [ -d data/h ] && python tools/nuit.py divh || true
          python tools/alertes.py || true
          # fiches automatiques (ventes par pays du rapport annuel, actualité, gouvernance) : toutes les actions par roulement, chacune refaite tous les 3 jours
          timeout 80m python tools/fiches.py 75 || true
          cp data/alertes.json "$RUNNER_TEMP/alertes.json" 2>/dev/null || true
          cp data/splits.json "$RUNNER_TEMP/splits.json" 2>/dev/null || true; cp data/divs.json "$RUNNER_TEMP/divs.json" 2>/dev/null || true
          if [ -d data/h ]; then python tools/nuit.py derniers; fi
          # on met de côté le travail : l'enregistrement repart de la dernière version du dépôt
          mkdir -p "$RUNNER_TEMP/out"
          [ -d data/h ] && cp -r data/h "$RUNNER_TEMP/out/" || true
          cp data/tickers.json "$RUNNER_TEMP/out/" || true
          cp data/logos.json "$RUNNER_TEMP/out/" 2>/dev/null || true
          [ -d data/f ] && cp -r data/f "$RUNNER_TEMP/out/" || true
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            [ -d "$RUNNER_TEMP/out/h" ] && mkdir -p data/h && cp -r "$RUNNER_TEMP/out/h/." data/h/
            [ -f "$RUNNER_TEMP/out/tickers.json" ] && cp "$RUNNER_TEMP/out/tickers.json" data/
            [ -f "$RUNNER_TEMP/out/logos.json" ] && cp "$RUNNER_TEMP/out/logos.json" data/
            [ -d "$RUNNER_TEMP/out/f" ] && mkdir -p data/f && cp -r "$RUNNER_TEMP/out/f/." data/f/
            [ -f "$RUNNER_TEMP/splits.json" ] && cp "$RUNNER_TEMP/splits.json" data/
            [ -f "$RUNNER_TEMP/divs.json" ] && cp "$RUNNER_TEMP/divs.json" data/
            [ -f "$RUNNER_TEMP/alertes.json" ] && cp "$RUNNER_TEMP/alertes.json" data/
            python tools/nuit.py appliquer
            git add data
            if git diff --cached --quiet; then echo "rien de neuf"; exit 0; fi
            git commit -q -m "Nuit $(date -u +%Y-%m-%d)"
            if git push -q origin main; then exit 0; fi
            sleep $((i * 7))
          done
          exit 1
