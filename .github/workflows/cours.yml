name: Cours
on:
  schedule:
    # Les déclenchements planifiés de GitHub arrivent souvent avec des heures de retard : ils ne servent plus qu'à
    # relancer la chaîne si elle s'est arrêtée. Le travail est fait par une tâche « relais » (~6 h) qui relance la suivante.
    - cron: '50 6 * * *'
    - cron: '35 12 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'relais, boucle, live, close ou hors'
        default: 'relais'
permissions:
  contents: write
  actions: write   # pour relancer le relais suivant
concurrency:
  group: live   # une seule tâche à la fois ; une seule en attente
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identité git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Mise à jour
        env:
          IN_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="${IN_MODE:-relais}"
          timeout 350m python tools/maj.py "$MODE" || true
      - name: Enregistrer
        run: |
          git add data
          if git diff --cached --quiet; then echo "rien de neuf"; exit 0; fi
          git commit -m "Cours $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q origin main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
      - name: Relancer le relais suivant
        if: ${{ !cancelled() && (github.event.inputs.mode == '' || github.event.inputs.mode == 'relais' || github.event_name == 'schedule') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cours.yml --repo "${{ github.repository }}" -f mode=relais
