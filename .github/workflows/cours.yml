name: Cours
on:
  schedule:
    - cron: '25 13 * * 1-5'   # 14h25 Paris : boucle « chaque minute » pendant la séance (jusqu'à 19h15 UTC)
    - cron: '10 19 * * 1-5'   # relais jusqu'à la clôture (21h20 UTC)
    - cron: '45 22 * * 1-5'   # le soir : clôtures -> prix, hebdo, changes
  workflow_dispatch:
    inputs:
      mode:
        description: 'boucle, live ou close'
        default: 'live'
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identité git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Mise à jour
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "45 22 * * 1-5") MODE=close ;;
              *) MODE=boucle ;;
            esac
          fi
          python tools/maj.py "$MODE"
      - name: Enregistrer
        run: |
          git add data
          if git diff --cached --quiet; then echo "rien de neuf"; exit 0; fi
          git commit -m "Cours $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin main
