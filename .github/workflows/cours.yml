name: Cours
on:
  schedule:
    # Boucle « chaque minute » toute la journée de bourse, en 3 relais de ~6 h (une tâche GitHub dure 6 h au plus) :
    - cron: '50 6 * * 1-5'    # 06h50 UTC : avant l'ouverture de Paris (9h l'hiver, 9h l'été = 7h UTC) -> ~12h40 UTC
    - cron: '35 12 * * 1-5'   # 12h35 UTC : Europe l'après-midi + ouverture américaine -> ~18h25 UTC
    - cron: '20 18 * * 1-5'   # 18h20 UTC : jusqu'à la clôture américaine (arrêt à 21h20 UTC)
    - cron: '45 22 * * 1-5'   # le soir : clôtures -> prix, hebdo, changes
  workflow_dispatch:
    inputs:
      mode:
        description: 'boucle, live ou close'
        default: 'live'
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identité git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Mise à jour
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "45 22 * * 1-5") MODE=close ;;
              *) MODE=boucle ;;
            esac
          fi
          python tools/maj.py "$MODE"
      - name: Enregistrer
        run: |
          git add data
          if git diff --cached --quiet; then echo "rien de neuf"; exit 0; fi
          git commit -m "Cours $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin main
