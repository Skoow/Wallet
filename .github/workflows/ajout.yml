name: Ajout
on:
  workflow_dispatch:
    inputs:
      cles:
        description: 'clés séparées par des virgules (ex. s/pg,s/ko,a/tsx-wcn)'
        required: true
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ajout.py "${{ github.event.inputs.cles }}"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Ajout ${{ github.event.inputs.cles }}" || exit 0
          git pull --rebase origin main
          git push origin main
