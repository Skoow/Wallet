name: Ajout
on:
  push:
    branches: [main]
    paths: ['data/a_ajouter.txt']   # une clé par ligne : ajoutée aux cours puis la liste est vidée
  workflow_dispatch:
    inputs:
      cles:
        description: 'clés séparées par des virgules (ex. s/pg,s/ko,a/tsx-wcn)'
        required: false
permissions:
  contents: write
concurrency:
  group: ajout   # à part : la boucle des cours dure des heures
  cancel-in-progress: false
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ajout.py "${{ github.event.inputs.cles }}"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Ajout de cours" || exit 0
          git pull --rebase origin main
          git push origin main
